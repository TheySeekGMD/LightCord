<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LightCord Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial, sans-serif;}
    body{background:#1e1f22;color:#fff;height:100vh;display:flex;}
    .sidebar{width:260px;background:#2b2d31;display:flex;flex-direction:column;border-right:2px solid #1a1b1e;}
    .sidebar h2{padding:20px;font-size:20px;border-bottom:2px solid #1a1b1e;}
    .messages-area{flex:1;display:flex;flex-direction:column;}
    .message-list{flex:1;overflow-y:auto;padding:20px;}
    .message{background:#313338;margin-bottom:12px;padding:12px;border-radius:8px;}
    .message-user{font-weight:bold;color:#3aa0ff;margin-bottom:4px;}
    .bottom-panel{padding:14px;background:#2b2d31;border-top:2px solid #1a1b1e;display:flex;gap:10px;}
    .bottom-panel input{flex:1;padding:12px;border:none;border-radius:6px;background:#1e1f22;color:white;}
    .bottom-panel button{padding:12px 20px;background:#5865f2;border:none;border-radius:6px;color:white;cursor:pointer;font-weight:bold;}
</style>
</head>
<body>

<div class="sidebar">
    <h2>LightCord</h2>
</div>

<div class="messages-area">
    <div class="message-list" id="msgList"></div>

    <div class="bottom-panel">
        <input type="text" id="username" placeholder="Ваш ник">
        <input type="text" id="msgInput" placeholder="Сообщение...">
        <button id="sendBtn">Отправить</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        databaseURL: "https://lightcord-da226-default-rtdb.firebaseio.com/"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const msgList = document.getElementById("msgList");
    const msgInput = document.getElementById("msgInput");
    const usernameInput = document.getElementById("username");
    const sendBtn = document.getElementById("sendBtn");

    sendBtn.onclick = () => {
        const text = msgInput.value.trim();
        const user = usernameInput.value.trim();
        if(!text || !user) return;

        db.ref("chat").push({
            user: user,
            text: text,
            time: Date.now()
        });

        msgInput.value = "";
    };

    db.ref("chat").on("child_added", snap => {
        const data = snap.val();
        const box = document.createElement("div");
        box.className = "message";
        box.innerHTML = `
            <div class="message-user">${data.user}</div>
            <div class="message-text">${data.text}</div>
        `;
        msgList.appendChild(box);
        msgList.scrollTop = msgList.scrollHeight;
    });
</script>

</body>
</html>
